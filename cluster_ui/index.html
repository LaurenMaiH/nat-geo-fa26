<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cluster Review</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg:        #0d0f14;
    --surface:   #161a24;
    --surface2:  #1e2435;
    --border:    #2a3050;
    --accent:    #4fd1c5;
    --accent2:   #f6ad55;
    --danger:    #fc8181;
    --success:   #68d391;
    --text:      #e2e8f0;
    --muted:     #718096;
    --new-glow:  rgba(79,209,197,0.15);
    --merge-glow:rgba(246,173,85,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .progress-bar-wrap {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .progress-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .cluster-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    white-space: nowrap;
  }

  /* ── LAYOUT ── */
  .main {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 57px);
  }

  /* ── LEFT SIDEBAR — existing clusters ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .sidebar-clusters {
    overflow-y: auto;
    flex: 1;
    padding: 8px;
  }
  .cluster-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .cluster-card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--new-glow);
  }
  .cluster-card.drop-target {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px var(--merge-glow);
  }
  .cluster-card-label {
    font-weight: 500;
    font-size: 13px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cluster-card-meta {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .cluster-thumbs {
    display: flex;
    gap: 4px;
  }
  .cluster-thumb {
    width: 52px;
    height: 38px;
    object-fit: cover;
    border-radius: 4px;
    background: var(--border);
  }
  .cluster-thumb-placeholder {
    width: 52px;
    height: 38px;
    background: var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 18px;
  }
  .edit-label-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
  }
  .edit-label-btn:hover { color: var(--accent); background: var(--border); }

  /* ── MAIN PANEL ── */
  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .video-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .video-name {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--accent);
  }
  .btn-row { display: flex; gap: 10px; }
  .btn {
    padding: 7px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary   { background: var(--accent);  color: #0d0f14; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger    { background: var(--danger);   color: #0d0f14; }
  .btn:disabled  { opacity: 0.4; cursor: not-allowed; }

  .assignments-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── ASSIGNMENT CARD ── */
  .assignment-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .assignment-card.is-new    { border-color: var(--accent); box-shadow: 0 0 0 1px var(--new-glow); }
  .assignment-card.is-merge  { border-color: var(--accent2); box-shadow: 0 0 0 1px var(--merge-glow); }

  .assignment-header {
    padding: 12px 16px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .badge {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .badge-new   { background: var(--accent);  color: #0d0f14; }
  .badge-merge { background: var(--accent2); color: #0d0f14; }
  .badge-noise { background: var(--muted);   color: #0d0f14; }

  .assignment-target {
    font-size: 13px;
    color: var(--text);
  }
  .assignment-target strong { color: var(--accent2); }
  .dist-badge {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    background: var(--border);
    padding: 2px 7px;
    border-radius: 4px;
  }

  /* controls inside assignment header */
  .assignment-controls {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  select.cluster-select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    max-width: 180px;
  }
  select.cluster-select:focus { border-color: var(--accent); }
  input.new-label-input {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 5px 10px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    width: 160px;
    outline: none;
  }

  /* crop grid */
  .crops-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 16px;
  }
  .crop-item {
    position: relative;
    cursor: grab;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.15s;
  }
  .crop-item:hover { transform: scale(1.04); border-color: var(--accent); }
  .crop-item.dragging { opacity: 0.4; }
  .crop-img {
    display: block;
    width: 80px;
    height: 60px;
    object-fit: cover;
    background: var(--border);
  }
  .crop-track-label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.65);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    padding: 2px 4px;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
  }

  /* ── EMPTY / DONE STATES ── */
  .center-msg {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--muted);
  }
  .center-msg .icon { font-size: 48px; }
  .center-msg h2 { font-size: 18px; color: var(--text); }
  .center-msg p  { font-size: 13px; max-width: 320px; text-align: center; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  #toast.show { opacity: 1; }
  #toast.ok   { border-color: var(--success); color: var(--success); }
  #toast.err  { border-color: var(--danger);  color: var(--danger);  }

  /* scrollbars */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Cluster Review</h1>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <span class="progress-label" id="progressLabel">— / —</span>
  <span class="cluster-count" id="clusterCount">0 clusters</span>
</header>

<div class="main">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">Existing Clusters</div>
    <div class="sidebar-clusters" id="sidebarClusters">
      <div style="padding:20px;color:var(--muted);font-size:12px;">No clusters yet.</div>
    </div>
  </aside>

  <!-- MAIN PANEL -->
  <section class="panel">
    <div class="video-header">
      <span class="video-name" id="videoName">Loading...</span>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btnSkip" onclick="skipVideo()">Skip Video</button>
        <button class="btn btn-primary"   id="btnConfirm" onclick="confirmProposal()" disabled>Confirm &amp; Next →</button>
      </div>
    </div>
    <div class="assignments-scroll" id="assignmentsScroll">
      <div class="center-msg" id="loadingMsg">
        <div class="icon">⏳</div>
        <h2>Analyzing video...</h2>
        <p>Running HDBSCAN and matching to existing clusters.</p>
      </div>
    </div>
  </section>
</div>

<div id="toast"></div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
let proposal      = null;
let globalClusters = {};
let status        = {};

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  await refreshStatus();
  await refreshClusters();
  if (!status.done) {
    await loadProposal();
  }
}

async function refreshStatus() {
  const r = await fetch("/api/status");
  status = await r.json();
  const pct = status.total_videos > 0
    ? (status.current_video_idx / status.total_videos * 100).toFixed(1)
    : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent =
    `${status.current_video_idx} / ${status.total_videos}`;
  document.getElementById("clusterCount").textContent =
    `${status.n_clusters} cluster${status.n_clusters !== 1 ? "s" : ""}`;
  document.getElementById("videoName").textContent =
    status.current_video || "—";
}

async function refreshClusters() {
  const r = await fetch("/api/clusters");
  globalClusters = await r.json();
  renderSidebar();
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const el = document.getElementById("sidebarClusters");
  if (Object.keys(globalClusters).length === 0) {
    el.innerHTML = `<div style="padding:20px;color:var(--muted);font-size:12px;">No clusters yet.</div>`;
    return;
  }
  el.innerHTML = Object.entries(globalClusters).map(([cid, info]) => {
    const thumbs = (info.rep_crops || []).map(c =>
      c.b64
        ? `<img class="cluster-thumb" src="data:image/jpeg;base64,${c.b64}" title="${c.track_key}">`
        : `<div class="cluster-thumb-placeholder">🐟</div>`
    ).join("");
    return `
      <div class="cluster-card" id="sidebar_${cid}"
           ondragover="event.preventDefault(); this.classList.add('drop-target')"
           ondragleave="this.classList.remove('drop-target')"
           ondrop="dropOnCluster(event, '${cid}')">
        <button class="edit-label-btn" onclick="promptRelabel('${cid}')" title="Rename">✎</button>
        <div class="cluster-card-label">
          <span>${info.label}</span>
        </div>
        <div class="cluster-card-meta">${info.n_members} track${info.n_members !== 1 ? "s" : ""} · ${cid}</div>
        <div class="cluster-thumbs">${thumbs || '<div class="cluster-thumb-placeholder">🐟</div>'}</div>
      </div>`;
  }).join("");
}

// ── LOAD PROPOSAL ─────────────────────────────────────────────────────────────
async function loadProposal() {
  document.getElementById("btnConfirm").disabled = true;
  document.getElementById("assignmentsScroll").innerHTML = `
    <div class="center-msg" id="loadingMsg">
      <div class="icon">⏳</div>
      <h2>Analyzing video...</h2>
      <p>Running HDBSCAN and matching to existing clusters.</p>
    </div>`;

  const r = await fetch("/api/propose");
  proposal = await r.json();

  if (proposal.done) {
    renderDone();
    return;
  }

  renderProposal();
  document.getElementById("btnConfirm").disabled = false;
}

// ── RENDER PROPOSAL ───────────────────────────────────────────────────────────
function renderProposal() {
  const scroll = document.getElementById("assignmentsScroll");

  if (!proposal.assignments || proposal.assignments.length === 0) {
    scroll.innerHTML = `
      <div class="center-msg">
        <div class="icon">🔍</div>
        <h2>No tracks found</h2>
        <p>This video has no embeddings. Click "Confirm & Next" to advance.</p>
      </div>`;
    document.getElementById("btnConfirm").disabled = false;
    return;
  }

  scroll.innerHTML = proposal.assignments.map((a, i) => {
    const isNew   = a.is_new;
    const label   = isNew ? "NEW SPECIES?" : "MERGE";
    const badgeCls = isNew ? "badge-new" : "badge-merge";
    const cardCls  = isNew ? "is-new" : "is-merge";

    const targetHtml = isNew
      ? `<span class="assignment-target">Will create a new cluster</span>`
      : `<span class="assignment-target">→ <strong>${a.proposed_label}</strong>
           <span style="color:var(--muted);font-size:11px;">(${a.proposed_cluster})</span></span>`;

    const distHtml = a.distance !== null
      ? `<span class="dist-badge">dist ${a.distance}</span>` : "";

    const clusterOptions = Object.entries(status.cluster_labels || {}).map(([cid, lbl]) =>
      `<option value="${cid}" ${!isNew && a.proposed_cluster === cid ? "selected" : ""}>${lbl} (${cid})</option>`
    ).join("");

    const controlsHtml = `
      <div class="assignment-controls">
        ${isNew ? `<input class="new-label-input" id="newlabel_${i}" placeholder="Label this cluster…">` : ""}
        <select class="cluster-select" id="select_${i}" onchange="reassign(${i}, this.value)">
          <option value="__new__" ${isNew ? "selected" : ""}>+ New cluster</option>
          ${clusterOptions}
        </select>
      </div>`;

    const cropsHtml = (a.crops || []).map(c => `
      <div class="crop-item" draggable="true"
           data-assignment="${i}" data-track="${c.track_key}"
           ondragstart="dragStart(event, ${i}, '${c.track_key}')">
        ${c.b64
          ? `<img class="crop-img" src="data:image/jpeg;base64,${c.b64}">`
          : `<div class="crop-img" style="display:flex;align-items:center;justify-content:center;color:var(--muted)">🐟</div>`}
        <div class="crop-track-label">${c.track_key.split("__")[1]}</div>
      </div>`).join("");

    return `
      <div class="assignment-card ${cardCls}" id="acard_${i}">
        <div class="assignment-header">
          <span class="badge ${badgeCls}">${label}</span>
          ${targetHtml}
          ${distHtml}
          ${controlsHtml}
        </div>
        <div class="crops-grid" id="crops_${i}">${cropsHtml}</div>
      </div>`;
  }).join("");
}

// ── REASSIGN ──────────────────────────────────────────────────────────────────
function reassign(assignmentIdx, value) {
  const a = proposal.assignments[assignmentIdx];
  const card = document.getElementById(`acard_${assignmentIdx}`);
  if (value === "__new__") {
    a.is_new = true;
    a.proposed_cluster = null;
    card.className = "assignment-card is-new";
  } else {
    a.is_new = false;
    a.proposed_cluster = value;
    a.proposed_label = status.cluster_labels[value] || value;
    card.className = "assignment-card is-merge";
  }
}

// ── DRAG & DROP ───────────────────────────────────────────────────────────────
let dragSrc = null;

function dragStart(event, assignmentIdx, trackKey) {
  dragSrc = { assignmentIdx, trackKey };
  event.dataTransfer.effectAllowed = "move";
  event.target.classList.add("dragging");
}

function dropOnCluster(event, clusterId) {
  event.preventDefault();
  document.getElementById(`sidebar_${clusterId}`).classList.remove("drop-target");
  if (!dragSrc) return;

  // find the assignment and mark it as merged to this cluster
  const a = proposal.assignments[dragSrc.assignmentIdx];
  a.is_new = false;
  a.proposed_cluster = clusterId;
  a.proposed_label = globalClusters[clusterId]?.label || clusterId;

  // update the select dropdown
  const sel = document.getElementById(`select_${dragSrc.assignmentIdx}`);
  if (sel) sel.value = clusterId;

  const card = document.getElementById(`acard_${dragSrc.assignmentIdx}`);
  if (card) card.className = "assignment-card is-merge";

  dragSrc = null;
  showToast(`Assigned to "${globalClusters[clusterId]?.label || clusterId}"`, "ok");
}

// ── CONFIRM ───────────────────────────────────────────────────────────────────
async function confirmProposal() {
  document.getElementById("btnConfirm").disabled = true;

  // collect new labels from inputs
  const confirmed = (proposal.assignments || []).map((a, i) => {
    const newLabelEl = document.getElementById(`newlabel_${i}`);
    return {
      track_keys:       a.track_keys,
      is_new:           a.is_new,
      proposed_cluster: a.proposed_cluster,
      new_centroid:     a.new_centroid,
      new_label:        newLabelEl ? newLabelEl.value.trim() : "",
    };
  });

  const r = await fetch("/api/confirm", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ assignments: confirmed }),
  });
  const res = await r.json();

  showToast(`Saved! ${res.videos_remaining} video${res.videos_remaining !== 1 ? "s" : ""} remaining.`, "ok");

  await refreshStatus();
  await refreshClusters();

  if (status.done) {
    renderDone();
  } else {
    await loadProposal();
  }
}

// ── SKIP ──────────────────────────────────────────────────────────────────────
async function skipVideo() {
  await fetch("/api/skip", { method: "POST" });
  showToast("Skipped.", "ok");
  await refreshStatus();
  if (status.done) {
    renderDone();
  } else {
    await loadProposal();
  }
}

// ── RELABEL ───────────────────────────────────────────────────────────────────
async function promptRelabel(cid) {
  const current = globalClusters[cid]?.label || cid;
  const label = prompt(`Rename cluster "${current}":`, current);
  if (!label || label === current) return;
  await fetch("/api/relabel", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cluster_id: cid, label }),
  });
  showToast(`Renamed to "${label}"`, "ok");
  await refreshClusters();
  await refreshStatus();
}

// ── DONE STATE ────────────────────────────────────────────────────────────────
function renderDone() {
  document.getElementById("videoName").textContent = "All videos processed";
  document.getElementById("btnConfirm").disabled = true;
  document.getElementById("btnSkip").disabled = true;
  document.getElementById("assignmentsScroll").innerHTML = `
    <div class="center-msg">
      <div class="icon">✅</div>
      <h2>All done!</h2>
      <p>Results saved to <code style="color:var(--accent)">cluster_results.json</code>.</p>
      <p style="margin-top:8px;">You have <strong style="color:var(--accent2)">${Object.keys(globalClusters).length} clusters</strong> total.</p>
    </div>`;
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast(msg, type = "ok") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = `show ${type}`;
  setTimeout(() => { t.className = ""; }, 3000);
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
